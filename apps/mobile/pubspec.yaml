name: cashdeck
description: "Cashdeck mobile app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  equatable: ^3.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  local_auth: ^3.0.2
  material_symbols_icons: ^4.2960.0

  mobile_scanner: ^7.4.2
  receive_sharing_intent: ^1.9.0
  riverpod: any
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
