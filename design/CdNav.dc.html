<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;background:var(--sf2);border-top:1px solid var(--olv);display:flex;flex-direction:column;font-family:Geist,sans-serif">
<div style="display:flex;height:80px">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative">
<sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><div style="width:56px;height:32px;border-radius:16px;background:var(--prc);color:var(--onprc);display:grid;place-items:center"><i style="font:22px/1 'Material Symbols Rounded';font-variation-settings:'FILL' 1">{{ it.i }}</i></div><span style="font-size:12px;font-weight:600;color:var(--on);white-space:nowrap">{{ it.l }}</span></sc-if>
<sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}"><div style="width:56px;height:32px;border-radius:16px;color:var(--mu);display:grid;place-items:center"><i style="font:22px/1 'Material Symbols Rounded'">{{ it.i }}</i></div><span style="font-size:12px;font-weight:500;color:var(--mu);white-space:nowrap">{{ it.l }}</span></sc-if>
<sc-if value="{{ it.badge }}"><span style="position:absolute;top:12px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--fail);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center">{{ it.badge }}</span></sc-if>
</div>
</sc-for>
</div>
<div style="height:16px;display:grid;place-items:center"><div style="width:108px;height:4px;border-radius:2px;background:var(--mu)"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:97},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;tx&quot;,&quot;bills&quot;,&quot;chat&quot;,&quot;more&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const L = [['home','home','Início'],['tx','receipt_long','Transações'],['bills','event_upcoming','A pagar'],['chat','forum','Chat'],['more','menu','Mais']];
    return { items: L.map(([k,i,l]) => ({ i, l, on: k === a, off: k !== a, badge: k === 'bills' ? '3' : '' })) };
  }
}
</script>
</body>
</html>
